name: module-rh1

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: rh
      POSTGRES_USER: rh
      POSTGRES_PASSWORD: rh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh -d rh"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5173
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: rh
      DB_USERNAME: rh
      DB_PASSWORD: rh
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS_ON_FRESH_DB: "true"
      PORT: 8001
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - ./backend/storage/logs:/var/www/html/storage/logs
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: /api
      VITE_BACKEND_URL: http://backend:8001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_vendor:
  backend_storage:
  frontend_node_modules:
